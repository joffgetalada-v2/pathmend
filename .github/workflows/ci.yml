name: CI
# Slimmed 2026-08-15 from the Shopify app-template CI. The template ran a
# 9-job matrix (Node 20/22/24 × npm/yarn/pnpm) to validate the template across
# environments; this app deploys on one Node LTS with npm, so one job covers it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The Prisma datasource URL is env-driven (see DECISIONS.md 2026-08-11);
      # locally it comes from the gitignored .env, which CI checkouts don't
      # have — prisma validate (and anything touching the client) needs this.
      DATABASE_URL: "file:dev.sqlite"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma generate && npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

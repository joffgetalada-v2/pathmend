name: Close Waiting for Response Issues
# DISABLED 2026-08-15 — inherited from Shopify's app-template repo, where it
# triages the template's own issue tracker. Not applicable to this app; the
# daily cron failed here (no issues:write on the default token). Safe to delete.
on:
  workflow_dispatch:
jobs:
  check-need-info:
    runs-on: ubuntu-latest
    steps:
      - name: close-issues
        uses: actions-cool/issues-helper@200c78641dbf33838311e5a1e0c31bbdb92d7cf0 # v3.8.0
        with:
          actions: "close-issues"
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: "Waiting for Response"
          inactive-day: 14
          body: |
            We are closing this issue because we did not hear back regarding additional details we needed to resolve this issue. If the issue persists and you are able to provide the missing clarification we need, you can respond here or create a new issue.

            We appreciate your understanding as we try to manage our number of open issues.
